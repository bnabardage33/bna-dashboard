<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BNA Catalogue</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 15px;
      background-color: #1A1D24;
      color: #fff;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
      color: #e2e8f0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #94a3b8;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      background-color: #0f1115;
      border: 1px solid #334155;
      color: white;
      border-radius: 4px;
      font-size: 13px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #ef4444;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #dc2626;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #b91c1c;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 15px;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h2>Ajouter au catalogue BNA</h2>
  
  <div class="form-group">
    <label>Catégorie</label>
    <select id="categorie">
      <option value="bardage">Bardage</option>
      <option value="etancheite">Étanchéité</option>
      <option value="habillage">Habillage</option>
      <option value="isolation">Isolation</option>
      <option value="installation">Installation</option>
    </select>
  </div>

  <div class="form-group">
    <label>Famille</label>
    <input type="text" id="famille_label" placeholder="ex: Bardage HPL">
  </div>

  <div class="form-group">
    <label>Désignation</label>
    <input type="text" id="designation" required>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Fabricant</label>
      <input type="text" id="fabricant">
    </div>
    <div class="form-group">
      <label>Fournisseur</label>
      <input type="text" id="fournisseur">
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Prix Unitaire HT (€)</label>
      <input type="text" id="pu_ht" placeholder="0.00" required>
    </div>
    <div class="form-group">
      <label>Unité</label>
      <select id="unite">
        <option value="m²">m²</option>
        <option value="U">Unité (U)</option>
        <option value="ml">ml</option>
        <option value="forfait">Forfait</option>
      </select>
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label>Épaisseur (mm)</label>
      <input type="number" id="epaisseur_mm" step="0.1">
    </div>
    <div class="form-group">
      <label>Code Décor</label>
      <input type="text" id="code_decor">
    </div>
  </div>

  <button id="saveBtn">Enregistrer dans Supabase</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
